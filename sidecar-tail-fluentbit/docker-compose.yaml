services:
  # --- Aggregator (受信側、独立コンテナ) ---
  aggregator:
    image: fluent/fluent-bit:3.2.10
    container_name: flb-aggregator
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./conf/aggregator-conf.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      # aggregator 側のディスクバッファ（受信後の転送先が詰まった時の退避先）
      - aggregator-buffer:/var/log/flb-storage
    ports:
      - "24224:24224"
    healthcheck:
      # Fluent Bit の HTTP server (uptime endpoint) を利用
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:2020/api/v1/uptime"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  # --- Go App ---
  app:
    build: .
    container_name: flb-app
    volumes:
      # sidecar とログファイルを共有
      - app-logs:/var/log/app
    restart: unless-stopped
  # --- Sidecar Fluent Bit ---
  sidecar:
    image: fluent/fluent-bit:5.0.5-debug
    container_name: flb-sidecar
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./conf/sidecar-conf.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      # app と同じログを read-only でマウント（誤書き込み防止）
      - app-logs:/var/log/app:ro
      # tail の DB（オフセット）と filesystem バッファを永続化
      # これを永続化しないとコンテナ再起動でロストor重複が起きる
      - sidecar-storage:/var/log/flb-storage
    ports:
      - 2020:2020
    depends_on:
      app:
        condition: service_started
      aggregator:
        condition: service_healthy
    restart: unless-stopped
volumes:
  app-logs:
  sidecar-storage:
  aggregator-buffer:
